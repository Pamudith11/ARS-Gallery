<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sign In | ARS Gallery</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400;1,600&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body class="signin-page">
  <main class="signin-shell">
    <a class="signin-logo" href="index.html">
      <img src="images/ars_logo.jpg" alt="ARS Gallery Logo" />
      <span><strong>ARS</strong><small>Gallery</small></span>
    </a>

    <section class="auth-dialog signin-card" aria-labelledby="signinTitle">
      <p class="tag">ARS Gallery</p>
      <h1 id="signinTitle">Welcome <em>back</em></h1>
      <p class="auth-demo-note">Sign in to continue or book a photography session. Email/password accounts must already be registered.</p>
      <form id="userSignInForm" class="signin-form">
        <label class="auth-field">
          <span>Email</span>
          <input id="userEmail" name="email" type="email" autocomplete="username" required />
        </label>
        <label class="auth-field">
          <span>Password</span>
          <input id="userPassword" name="password" type="password" autocomplete="current-password" required />
        </label>
        <button type="submit" class="btn-primary signin-submit">Sign In</button>
      </form>

      <div class="signin-divider"><span>or</span></div>
      <button id="googleSignInButton" type="button" class="google-sign-in">
        <span class="google-mark" aria-hidden="true">G</span>
        Continue with Google
      </button>

      <button
        id="toggleAdminSignIn"
        class="auth-admin-link admin-signin-toggle"
        type="button"
        aria-expanded="false"
        aria-controls="adminSignInSection"
      >Admin Sign In</button>

      <section id="adminSignInSection" class="admin-signin-section" aria-labelledby="adminSignInTitle" hidden>
        <h2 id="adminSignInTitle">Admin Sign In</h2>
        <p class="auth-demo-note">Use the verified admin account registered in Firebase Authentication.</p>
        <form id="adminSignInForm" class="signin-form">
          <label class="auth-field">
            <span>Admin email</span>
            <input id="adminEmail" name="email" type="email" autocomplete="username" required />
          </label>
          <label class="auth-field">
            <span>Password</span>
            <input id="adminPassword" name="password" type="password" autocomplete="current-password" required />
          </label>
          <button type="submit" class="btn-primary signin-submit">Sign In to Admin Panel</button>
        </form>
      </section>

      <p id="authMessage" class="auth-message" role="status" aria-live="polite"></p>
    </section>

    <a class="signin-home-link" href="index.html">← Back to ARS Gallery</a>
  </main>
  <script type="module" src="signin.js"></script>
</body>
</html>
